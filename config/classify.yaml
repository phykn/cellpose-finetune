# Temporary image/mask/JSON triples. Replace these example class names with yours.
data:
  image_dir: data/train/images
  mask_dir: data/train/masks
  label_dir: data/train/labels
  channel_axis: null
  crop_size: 384
  augment: true
  batch_size: 1
  num_workers: 0

model:
  backbone: vitb16
  backbone_weights: weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  patch_stride: 8
  classes: [type_A, type_B]

optim:
  learning_rate: 0.00001
  weight_decay: 0.1

train:
  seed: 0
  total_steps: 10000
  mixed_precision: true
  save_every_steps: 500
  resume: null
  weights: null
  class_loss_weight: 1.0

predict:
  tile_size: 384
  overlap: 0.1
  niter: 200
  cellprob_threshold: 0.0
  flow_threshold: 0.4
  min_size: 15
  max_size_fraction: 0.4
